<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team 1.01</title>
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="pagina-topo tema-azul">
    <div class="container" style="max-width:760px">
      <a href="index.html" class="text-sm voltar"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icone-svg"><path d="m15 18-6-6 6-6" /></svg> Voltar</a>

      <div class="section-heading mt-24">
        <span class="eyebrow">INSCRIÇÕES</span>
        <h2 id="form-titulo">Inscreva-se</h2>
        <p id="form-subtitulo">Preencha o formulário abaixo para participar da seleção da SPSkills.</p>
      </div>

    </div>
    </section>

    <section class="section pagina-conteudo">
    <div class="container" style="max-width:760px">
      <div class="card">
        <iframe
          id="forms-iframe"
          class="forms-iframe"
          title="Formulário de inscrição"
          loading="lazy">Carregando…</iframe>
      </div>

      <p class="text-sm mt-16" style="text-align:center;color:var(--texto-secundario)">
        O formulário não carregou?
        <a id="forms-link" target="_blank" rel="noopener" style="font-weight:600;color:var(--azul-vibrante)">Abrir em uma nova aba</a>
      </p>
    </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="js/pages/inscricao-form.js"></script>
</body>
</html>
