<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team 1.01</title>
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="stylesheet" href="css/styles.css?v=202610211347" />
  <script>
    // Marca que o JS está ativo (as animações de entrada dependem disso).
    document.documentElement.classList.add('js-anim');
    // Ao recarregar, a página sempre começa do topo: sem lembrar onde parou e sem
    // pular para a seção do #endereço (ex.: #modalidades depois de usar o menu).
    // Links vindos de outra página (ex.: "Voltar para Modalidades") continuam indo à seção.
    (function () {
      var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      if (!nav || nav.type !== 'reload') return;
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
      addEventListener('pagehide', function () { history.scrollRestoration = 'auto'; });
      // O navegador às vezes devolve a rolagem antes deste script rodar, então a página
      // também sobe para o topo quando o HTML e depois tudo (imagens, dados) termina de carregar.
      var topo = function () { scrollTo(0, 0); };
      addEventListener('DOMContentLoaded', topo);
      addEventListener('load', function () { topo(); requestAnimationFrame(topo); });
    })();
  </script>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="pagina-topo tema-azul">
    <div class="container" style="max-width:760px">
      <a href="index.html" class="text-sm voltar"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icone-svg"><path d="m15 18-6-6 6-6" /></svg> Voltar</a>

      <div class="section-heading mt-24">
        <span class="eyebrow">INSCRIÇÕES</span>
        <h2 id="form-titulo">Inscreva-se</h2>
        <p id="form-subtitulo">Preencha o formulário abaixo para participar da seleção da SPSkills.</p>
      </div>

    </div>
    </section>

    <section class="section pagina-conteudo">
    <div class="container" style="max-width:760px">
      <div class="card">
        <iframe
          id="forms-iframe"
          class="forms-iframe"
          title="Formulário de inscrição"
          loading="lazy">Carregando…</iframe>
      </div>

      <p class="text-sm mt-16" style="text-align:center;color:var(--texto-secundario)">
        O formulário não carregou?
        <a id="forms-link" target="_blank" rel="noopener" style="font-weight:600;color:var(--azul-vibrante)">Abrir em uma nova aba</a>
      </p>
    </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="js/pages/inscricao-form.js?v=202610211347"></script>
</body>
</html>
