<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team 1.01</title>
  <meta name="description" content="A história do SENAI Brás na WorldSkills, ciclo a ciclo: etapas, modalidades, competidores e medalhas desde 1995." />
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="stylesheet" href="css/styles.css?v=202610211453" />
  <script>
    // Marca que o JS está ativo (as animações de entrada dependem disso).
    document.documentElement.classList.add('js-anim');
    // Ao recarregar, a página sempre começa do topo: sem lembrar onde parou e sem
    // pular para a seção do #endereço (ex.: #modalidades depois de usar o menu).
    // Links vindos de outra página (ex.: "Voltar para Modalidades") continuam indo à seção.
    (function () {
      var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      if (!nav || nav.type !== 'reload') return;
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
      addEventListener('pagehide', function () { history.scrollRestoration = 'auto'; });
      // O navegador às vezes devolve a rolagem antes deste script rodar, então a página
      // também sobe para o topo quando o HTML e depois tudo (imagens, dados) termina de carregar.
      var topo = function () { scrollTo(0, 0); };
      addEventListener('DOMContentLoaded', topo);
      addEventListener('load', function () { topo(); requestAnimationFrame(topo); });
    })();
  </script>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="pagina-topo tema-ouro">
    <div class="container" style="max-width:860px">
      <a href="index.html#sobre" class="text-sm voltar"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icone-svg"><path d="m15 18-6-6 6-6" /></svg> Voltar para a página inicial</a>

      <div class="section-heading mt-24">
        <span class="eyebrow">NOSSA HISTÓRIA</span>
        <h2>Linha do tempo dos competidores</h2>
        <p>Desde 1995, o SENAI Brás disputa a WorldSkills em busca de representar o Brasil no mundial. Veja, ciclo a ciclo, quem foram os competidores, em quais modalidades e quais medalhas trouxeram para casa.</p>
      </div>

    </div>
    </section>

    <section class="section pagina-conteudo">
    <div class="container" style="max-width:860px">
      <div id="linha-do-tempo-stats" class="stat-grid stat-grid--auto"><div class="spinner"></div></div>

      <div class="flex gap-12 flex-wrap mt-8" id="linha-do-tempo-filtros">
        <input type="search" id="lt-busca" placeholder="Buscar competidor ou modalidade..." style="flex:1;min-width:0" />
        <select id="lt-filtro-etapa" style="min-width:170px">
          <option value="">Todas as etapas</option>
        </select>
        <select id="lt-filtro-medalha" style="min-width:170px">
          <option value="">Todas as medalhas</option>
        </select>
        <button type="button" class="btn btn-outline" id="lt-limpar-filtros">Limpar filtros</button>
      </div>

      <div id="linha-do-tempo-lista" class="mt-24"><div class="spinner"></div></div>
    </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="js/pages/linha-do-tempo.js?v=202610211453"></script>
</body>
</html>
